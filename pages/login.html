<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span></a>
  <div class="nav-actions">
    <a href="register.html" class="btn btn-sm btn-outline">Register</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Welcome Back 👋</h2>
    <p class="subtitle">Sign in to your account to continue</p>
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <div id="error-msg" style="color:var(--error);font-size:0.85rem;margin-bottom:14px;display:none"></div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign In</button>
    </form>
    <div class="auth-link">Don't have an account? <a href="register.html">Register here</a></div>
    <div class="auth-link" style="margin-top:8px">
      <small style="color:var(--text-muted)">Admin: admin@royallegacy.com / admin123</small>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
if(Auth.isLoggedIn()) location.href = "../index.html";

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("error-msg");
  btn.disabled = true; btn.textContent = "Signing in...";
  errEl.style.display = "none";
  try {
    const data = await ApiService.post(API.AUTH + "/login", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    Auth.save(data);
    showToast("Login successful!");
    setTimeout(() => {
      location.href = data.role === "ADMIN" ? "admin.html" : "../index.html";
    }, 600);
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    btn.disabled = false; btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
