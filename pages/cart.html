<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cart — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled" id="navbar">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span></a>
  <ul class="nav-links" id="nav-links">
    <li><a href="../index.html">Home</a></li><li><a href="menu.html">Menu</a></li>
  </ul>
  <div class="nav-actions" id="nav-actions"></div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<section style="padding-top:110px">
  <div class="section-header">
    <div class="section-badge">🛒 Shopping Cart</div>
    <h2>Your Cart</h2>
  </div>
  <div id="cart-content"></div>
</section>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  updateNav();
  document.getElementById("hamburger").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("open"));
  renderCart();
});

function renderCart(){
  const items = Cart.getAll();
  const el = document.getElementById("cart-content");
  if(items.length === 0){
    el.innerHTML = `<div class="empty-cart">
      <div class="empty-icon">🛒</div>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added anything yet.</p>
      <a href="menu.html" class="btn btn-primary btn-lg">Browse Menu</a>
    </div>`;
    return;
  }
  const subtotal = Cart.getTotal();
  const delivery = 2.99;
  const total = subtotal + delivery;
  el.innerHTML = `
  <div class="cart-layout">
    <div class="cart-items" id="cart-items-list">
      ${items.map(cartItemRow).join("")}
    </div>
    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
      <div class="summary-row"><span>Delivery</span><span>$${delivery.toFixed(2)}</span></div>
      <div class="summary-row total"><span>Grand Total</span><span>$${total.toFixed(2)}</span></div>
      <br>
      <button class="btn btn-primary" style="width:100%" onclick="proceedCheckout()">Proceed to Checkout →</button>
      <br><br>
      <button class="btn btn-danger" style="width:100%;padding:10px" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>`;
}

function cartItemRow(item){
  return `
  <div class="cart-item" id="cart-row-${item.id}">
    <img class="cart-item-img" src="${item.imageUrl}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'">
    <div class="cart-item-info">
      <h4>${item.name}</h4>
      <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${item.id}, ${item.quantity - 1})">−</button>
        <span class="qty-num">${item.quantity}</span>
        <button class="qty-btn" onclick="changeQty(${item.id}, ${item.quantity + 1})">+</button>
      </div>
    </div>
    <button class="cart-remove" onclick="removeItem(${item.id})" title="Remove">✕</button>
  </div>`;
}

function changeQty(id, qty){
  Cart.updateQty(id, qty);
  renderCart();
}
function removeItem(id){
  Cart.remove(id);
  renderCart();
}
function clearCart(){
  if(confirm("Clear all items from cart?")){ Cart.clear(); renderCart(); }
}
function proceedCheckout(){
  if(!Auth.isLoggedIn()){
    showToast("Please login first to checkout", "error");
    setTimeout(()=>location.href="login.html",1200);
    return;
  }
  location.href="checkout.html";
}
</script>
</body>
</html>
