<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Placed — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span></a>
</nav>

<div class="success-wrapper">
  <div class="success-card">
    <div class="success-icon">✓</div>
    <h2>Order Placed!</h2>
    <p>Thank you! Your order has been confirmed and is being prepared.</p>
    <div class="order-num" id="order-num">RL-00000</div>
    <div class="delivery-time">
      🕐 Estimated Delivery: <strong id="delivery-time">30–45 minutes</strong>
    </div>
    <div class="success-details" id="order-details"></div>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px">
      <a href="menu.html" class="btn btn-primary">Order More</a>
      <a href="../index.html" class="btn btn-outline">Back to Home</a>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const p = new URLSearchParams(window.location.search);
  const orderNum = p.get("order") || "RL-00000";
  const time = p.get("time") || "30";
  const total = p.get("total") || "0.00";
  document.getElementById("order-num").textContent = orderNum;
  document.getElementById("delivery-time").textContent = `${time}–${parseInt(time)+10} minutes`;
  document.getElementById("order-details").innerHTML = `
    <p><span>Order Number</span><span>${orderNum}</span></p>
    <p><span>Total Amount</span><span>$${parseFloat(total).toFixed(2)}</span></p>
    <p><span>Payment</span><span>Cash on Delivery</span></p>
    <p><span>Status</span><span><span class="badge badge-success">Confirmed</span></span></p>`;
});
</script>
</body>
</html>
