<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Food Detail — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled" id="navbar">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span></a>
  <ul class="nav-links" id="nav-links">
    <li><a href="../index.html">Home</a></li><li><a href="menu.html" class="active">Menu</a></li>
    <li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions" id="nav-actions"></div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div id="content">
  <div class="loader" style="padding-top:140px"><div class="spinner"></div></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
let qty = 1;

document.addEventListener("DOMContentLoaded", async () => {
  updateNav();
  document.getElementById("hamburger").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("open"));
  const id = new URLSearchParams(window.location.search).get("id");
  if(!id){ document.getElementById("content").innerHTML=`<p style="text-align:center;padding:120px;color:var(--error)">Invalid food item.</p>`; return; }
  try {
    const food = await ApiService.get(API.FOODS + "/" + id);
    renderDetail(food);
  } catch(e) {
    document.getElementById("content").innerHTML=`<p style="text-align:center;padding:120px;color:var(--error)">Food not found.</p>`;
  }
});

function renderDetail(f){
  const stars = "★".repeat(Math.round(f.rating))+"☆".repeat(5-Math.round(f.rating));
  document.getElementById("content").innerHTML = `
  <div class="food-detail-layout">
    <div class="food-detail-img">
      <img src="${f.imageUrl}" alt="${f.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'">
    </div>
    <div class="food-detail-content">
      <span class="food-category-tag">${f.category}</span>
      <h1>${f.name}</h1>
      <div class="food-detail-meta">
        <span class="food-detail-price">$${f.price.toFixed(2)}</span>
        <span class="food-rating"><span class="star">${stars}</span> ${f.rating} rating</span>
      </div>
      <p class="food-detail-desc">${f.description}</p>
      <div class="detail-qty">
        <label>Quantity:</label>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-num" id="qty-display">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <button class="btn btn-primary btn-lg" onclick="addToCart(${f.id},'${f.name.replace(/'/g,"\\'")}',${f.price},'${f.imageUrl}')">
          🛒 Add to Cart — $<span id="total-price">${f.price.toFixed(2)}</span>
        </button>
        <a href="cart.html" class="btn btn-outline btn-lg">View Cart</a>
      </div>
      <br>
      <a href="menu.html" style="color:var(--primary);font-size:0.9rem">← Back to Menu</a>
    </div>
  </div>`;
  window._food = f;
}

function changeQty(delta){
  qty = Math.max(1, qty + delta);
  document.getElementById("qty-display").textContent = qty;
  if(window._food) document.getElementById("total-price").textContent = (window._food.price * qty).toFixed(2);
}

function addToCart(id, name, price, imageUrl){
  const items = Cart.getAll();
  const existing = items.find(i => i.id === id);
  if(existing){
    existing.quantity += qty;
    Cart.save(items);
  } else {
    const newItem = {id, name, price, imageUrl, quantity: qty};
    items.push(newItem);
    Cart.save(items);
  }
  showToast(`${name} x${qty} added to cart!`);
  updateCartCount();
}
</script>
</body>
</html>
