<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span></a>
  <div class="nav-actions">
    <a href="login.html" class="btn btn-sm btn-outline">Login</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account 🎉</h2>
    <p class="subtitle">Join Royal Legacy and start ordering</p>
    <form id="register-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" class="form-control" placeholder="+880..." required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div id="error-msg" style="color:var(--error);font-size:0.85rem;margin-bottom:14px;display:none"></div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="reg-btn">Create Account</button>
    </form>
    <div class="auth-link">Already have an account? <a href="login.html">Login here</a></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
if(Auth.isLoggedIn()) location.href = "../index.html";

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reg-btn");
  const errEl = document.getElementById("error-msg");
  btn.disabled = true; btn.textContent = "Creating account...";
  errEl.style.display = "none";
  try {
    const data = await ApiService.post(API.AUTH + "/register", {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      password: document.getElementById("password").value
    });
    Auth.save(data);
    showToast("Account created! Welcome!");
    setTimeout(() => location.href = "../index.html", 700);
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    btn.disabled = false; btn.textContent = "Create Account";
  }
});
</script>
</body>
</html>
