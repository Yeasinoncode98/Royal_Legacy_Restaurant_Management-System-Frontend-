<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel — Royal Legacy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar scrolled">
  <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">👑</div>Royal <span>Legacy</span> <span style="font-size:0.7rem;color:var(--text-muted);margin-left:6px">Admin</span></a>
  <div class="nav-actions">
    <span id="admin-name" style="color:var(--text-muted);font-size:0.9rem"></span>
    <button onclick="Auth.logout()" class="btn btn-sm btn-outline">Logout</button>
  </div>
</nav>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-title">Menu</div>
    <div class="sidebar-link active" onclick="showPanel('foods')">🍽️ Food Items</div>
    <div class="sidebar-link" onclick="showPanel('add')">➕ Add Food</div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <!-- Food List Panel -->
    <div class="admin-panel active" id="panel-foods">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
        <h2>Food Items</h2>
        <button class="btn btn-primary btn-sm" onclick="showPanel('add')">+ Add New Food</button>
      </div>
      <div id="food-table-wrapper"><div class="loader"><div class="spinner"></div></div></div>
    </div>

    <!-- Add/Edit Panel -->
    <div class="admin-panel" id="panel-add">
      <h2 id="form-title">Add New Food</h2>
      <br>
      <div class="checkout-form-card" style="max-width:600px">
        <form id="food-form">
          <input type="hidden" id="edit-id">
          <div class="form-row">
            <div class="form-group">
              <label>Food Name</label>
              <input type="text" id="f-name" class="form-control" required placeholder="e.g. Grilled Chicken">
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="f-category" class="form-control">
                <option>Grills</option><option>Burgers</option><option>Pizza</option>
                <option>Pasta</option><option>Seafood</option><option>Salads</option>
                <option>Wraps</option><option>Desserts</option><option>Drinks</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Price ($)</label>
              <input type="number" id="f-price" class="form-control" step="0.01" min="0" required placeholder="9.99">
            </div>
            <div class="form-group">
              <label>Rating (1–5)</label>
              <input type="number" id="f-rating" class="form-control" min="1" max="5" step="0.1" value="4.5">
            </div>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="f-image" class="form-control" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="f-desc" class="form-control" rows="3" placeholder="Short description..."></textarea>
          </div>
          <div id="form-err" style="color:var(--error);font-size:0.85rem;display:none;margin-bottom:10px"></div>
          <div style="display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" id="save-btn">Save Food</button>
            <button type="button" class="btn btn-outline" onclick="showPanel('foods')">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="del-modal">
  <div class="modal" style="max-width:400px;text-align:center">
    <p style="font-size:3rem;margin-bottom:16px">🗑️</p>
    <h3 style="margin-bottom:12px">Delete Food Item?</h3>
    <p style="margin-bottom:28px">This action cannot be undone.</p>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-danger" id="confirm-del-btn">Yes, Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
let deleteTargetId = null;

document.addEventListener("DOMContentLoaded", () => {
  if(!Auth.isAdmin()){ location.href="login.html"; return; }
  const u = Auth.get();
  document.getElementById("admin-name").textContent = "Hi, " + u.name;
  loadFoods();
  document.getElementById("food-form").addEventListener("submit", saveFood);
  document.getElementById("confirm-del-btn").addEventListener("click", confirmDelete);
});

function showPanel(name){
  document.querySelectorAll(".admin-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".sidebar-link").forEach(l=>l.classList.remove("active"));
  document.getElementById("panel-"+name).classList.add("active");
  document.querySelectorAll(".sidebar-link")[name==="add"?1:0].classList.add("active");
  if(name==="foods") loadFoods();
  if(name==="add"){ clearForm(); document.getElementById("form-title").textContent="Add New Food"; }
}

async function loadFoods(){
  const wrapper = document.getElementById("food-table-wrapper");
  wrapper.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
  try {
    const foods = await ApiService.get(API.FOODS);
    if(foods.length===0){ wrapper.innerHTML=`<p style="padding:30px;color:var(--text-muted)">No food items yet.</p>`; return; }
    wrapper.innerHTML = `
    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Rating</th><th>Actions</th></tr></thead>
        <tbody>${foods.map(f=>`
        <tr>
          <td><img src="${f.imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=80'"></td>
          <td>${f.name}</td>
          <td>${f.category}</td>
          <td>$${f.price.toFixed(2)}</td>
          <td>★ ${f.rating}</td>
          <td><div class="action-btns">
            <button class="btn btn-sm btn-outline" onclick="editFood(${f.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="openDeleteModal(${f.id})">Delete</button>
          </div></td>
        </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  } catch(e){ wrapper.innerHTML=`<p style="color:var(--error);padding:30px">${e.message}</p>`; }
}

async function editFood(id){
  try {
    const f = await ApiService.get(API.FOODS+"/"+id);
    document.getElementById("edit-id").value = f.id;
    document.getElementById("f-name").value = f.name;
    document.getElementById("f-category").value = f.category;
    document.getElementById("f-price").value = f.price;
    document.getElementById("f-rating").value = f.rating;
    document.getElementById("f-image").value = f.imageUrl||"";
    document.getElementById("f-desc").value = f.description||"";
    document.getElementById("form-title").textContent = "Edit Food";
    showPanel("add");
    document.querySelectorAll(".sidebar-link")[1].classList.add("active");
  } catch(e){ showToast(e.message,"error"); }
}

async function saveFood(e){
  e.preventDefault();
  const btn=document.getElementById("save-btn");
  const errEl=document.getElementById("form-err");
  btn.disabled=true; btn.textContent="Saving..."; errEl.style.display="none";
  const id = document.getElementById("edit-id").value;
  const body = {
    name:document.getElementById("f-name").value,
    category:document.getElementById("f-category").value,
    price:parseFloat(document.getElementById("f-price").value),
    rating:parseFloat(document.getElementById("f-rating").value),
    imageUrl:document.getElementById("f-image").value,
    description:document.getElementById("f-desc").value,
    available:true
  };
  try {
    if(id){ await ApiService.put(API.FOODS+"/"+id, body); showToast("Food updated!"); }
    else { await ApiService.post(API.FOODS, body); showToast("Food added!"); }
    clearForm();
    showPanel("foods");
  } catch(err){ errEl.textContent=err.message; errEl.style.display="block"; }
  finally { btn.disabled=false; btn.textContent="Save Food"; }
}

function openDeleteModal(id){ deleteTargetId=id; document.getElementById("del-modal").classList.add("open"); }
function closeModal(){ document.getElementById("del-modal").classList.remove("open"); deleteTargetId=null; }
async function confirmDelete(){
  if(!deleteTargetId) return;
  try {
    await ApiService.del(API.FOODS+"/"+deleteTargetId);
    showToast("Food deleted!","error");
    closeModal(); loadFoods();
  } catch(e){ showToast(e.message,"error"); closeModal(); }
}

function clearForm(){
  document.getElementById("food-form").reset();
  document.getElementById("edit-id").value="";
  document.getElementById("form-err").style.display="none";
}
</script>
</body>
</html>
